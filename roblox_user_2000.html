<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="4; url=index.html">
<title>Roblox_User_2000</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one centered card on a dusk ground; it only exists to send people to Stick Legions. */
:root {
  --ground: #1d1530;
  --card: #241c26;
  --gold: #ffcf3f;
  --text: #f4ecdf;
  --muted: #b9ab9a;
  --display: "Lilita One", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: linear-gradient(180deg, var(--ground), #5a2a3a 70%, #b8503a); color: var(--text); font-family: var(--body);
  display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; box-sizing: border-box; }
.card { background: var(--card); border: 3px solid var(--gold); border-radius: 18px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; display: grid; gap: 14px; box-shadow: 0 8px 0 #0d0908; }
.who { font-weight: 800; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; color: #fff; text-wrap: balance; }
h1 span { color: var(--gold); }
p { margin: 0; color: var(--muted); }
.go { font-family: var(--display); font-size: 22px; color: #fff; text-decoration: none; background: linear-gradient(180deg, #d84530, #8f2414); border: 3px solid var(--gold); border-radius: 12px; padding: 12px 20px; box-shadow: 0 5px 0 #4a120a; justify-self: center; }
.go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#count { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 800; }
</style>
<script src="lang.js" defer></script>
</head>
<body>


<main class="card">
  <span class="who">Roblox_User_2000 · akami</span>
  <h1>Taking you to <span>Stick Legions</span></h1>
  <p id="msg">Opening the game site in <span id="count">3</span>…</p>
  <a class="go" id="go" href="index.html">Go to Stick Legions</a>
  <p>If nothing happens, tap the button.</p>
</main>

<script>
const url = document.getElementById('go').href;
let n = 3;
const el = document.getElementById('count');
const t = setInterval(() => {
  n -= 1;
  if (n > 0) { el.textContent = n; return; }
  clearInterval(t);
  document.getElementById('msg').textContent = 'Opening Stick Legions…';
  window.location.href = url;
}, 1000);
</script>
</body>
</html>
